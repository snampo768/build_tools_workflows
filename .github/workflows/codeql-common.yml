name: CodeQL Common Framework

on:
  workflow_call:
    inputs:
      repo_type:
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:

      - name: Echo repo type
        run: echo " repo_type is ${{ inputs.repo_type }}"
        
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
            languages: ${{ matrix.language }}
            build-mode: ${{ matrix.build-mode }}

      - name: Native build component
        uses: snampo768/build_tools_workflows/.github/actions/codeql-build-action@main
      
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4

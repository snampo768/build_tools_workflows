name: CodeQL Common Framework

on:
  workflow_call:
    inputs:
      repo_type:
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest
    
    env:
      BUILD_ACTION: codeql-build-${{ inputs.repo_type }}
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:

      - name: Echo Build Action
        run: echo "Build Action repo_type is ${{ env.BUILD_ACTION }}"
        
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
            build-mode: manual

      - name: Native build component
        uses: snampo768/build_tools_workflows/.github/actions/${{ env.BUILD_ACTION }}@main
      
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4

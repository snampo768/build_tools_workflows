name: CodeQL Common Framework

on:
  workflow_call:
    inputs:
      repo_type:
        required: true
        type: string
      container_image:
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:
      - run: echo "Running in ${{ inputs.container_image }}"
      
      - run: echo " Repository type is ${{ inputs.repo_type }}"
        
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
            languages: ${{ matrix.language }}
            build-mode: ${{ matrix.build-mode }}

      - name: Native build component
        uses: snampo768/build_tools_workflows/.github/actions/codeql-build-action@main
        with:
          repo_type: ${{ inputs.repo_type }}
      
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v4
